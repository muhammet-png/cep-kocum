<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131821">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.CEP_PWA = true;</script>
</head>
<body><title>Cep Koçum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Layout: mobile-first single column; sticky header with live clock; "now" hero card, then a compact day timeline; bottom tab bar. Colors from olympic bumper plates (red 25, blue 20, yellow 15, green 10). */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#EBEEF3; --fg:#131821; --muted:#5A6473; --line:#DCE1E8;
  --red:#D23A2F; --blue:#1E5DC2; --yellow:#B98708; --green:#1F7F55; --on-accent:#FFFFFF;
  --red-soft:#FBE7E5; --blue-soft:#E3ECFA; --yellow-soft:#FAF0D4; --green-soft:#DEF1E7;
  --display:'Barlow Condensed','Avenir Next Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1217; --surface:#161B22; --surface-2:#1F2630; --fg:#E7EBF1; --muted:#98A2B2; --line:#29313C;
  --red:#F06A5F; --blue:#78A6F3; --yellow:#F0C445; --green:#4DC18B; --on-accent:#0E1217;
  --red-soft:#3A1F1D; --blue-soft:#192A46; --yellow-soft:#362E14; --green-soft:#15332A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#161B22; --surface-2:#1F2630; --fg:#E7EBF1; --muted:#98A2B2; --line:#29313C;
  --red:#F06A5F; --blue:#78A6F3; --yellow:#F0C445; --green:#4DC18B; --on-accent:#0E1217;
  --red-soft:#3A1F1D; --blue-soft:#192A46; --yellow-soft:#362E14; --green-soft:#15332A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brandwrap{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;flex:0 0 auto}
.lg-bar{fill:var(--fg)} .lg-plate{fill:var(--red)} .lg-ring{fill:none;stroke:var(--bg);stroke-opacity:.35;stroke-width:2} .lg-hub{fill:var(--bg);stroke:var(--fg);stroke-width:2}
.brand{min-width:0;white-space:nowrap;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.03em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:0;color:var(--muted);text-transform:none;margin-top:4px}
.clock{font-family:var(--display);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.clock small{display:block;font-family:var(--body);font-size:11px;font-weight:700;color:var(--muted);margin-top:3px;letter-spacing:.02em}
h2{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin:24px 0 10px;text-wrap:balance}
h3{font-size:15px;font-weight:700;margin:0;line-height:1.35}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;vertical-align:1px}
.p-blue{background:var(--blue-soft);color:var(--blue)} .p-red{background:var(--red-soft);color:var(--red)}
.p-yellow{background:var(--yellow-soft);color:var(--yellow)} .p-green{background:var(--green-soft);color:var(--green)}
.p-gray{background:var(--surface-2);color:var(--muted)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:42px}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.green{background:var(--green);color:var(--on-accent);border-color:var(--green)}
.btn.full{width:100%}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:700;cursor:pointer;font-size:13px;text-decoration:none}
input,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* hero */
.hero{margin-top:14px;background:var(--surface);border:2px solid var(--fg);border-radius:18px;padding:16px}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.hero .eyebrow b{color:var(--red);font-variant-numeric:tabular-nums}
.hero h3{font-size:20px;margin-top:6px;text-wrap:balance}
.hero p.sub{margin-top:6px;color:var(--muted);font-size:14px}
.hero .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero .actions .btn{flex:1 1 auto}
.q{margin-top:12px}
.q p{font-size:13px;font-weight:700;margin-bottom:6px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;min-height:38px}
.opt.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat b small{font-size:14px;color:var(--muted)}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:9px}
.stat .mini{margin-top:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;font-size:12px;font-weight:700;padding:4px 6px;cursor:pointer}

/* coach notes */
.notes{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45}
.note i{flex:0 0 auto;width:8px;height:8px;border-radius:50%;margin-top:6px}

/* timeline */
.tl{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:46px minmax(0,1fr) 44px;gap:10px;align-items:center;padding:11px 10px 11px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.now{background:var(--surface-2)}
.item .time{font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;line-height:1;display:flex;flex-direction:column;gap:6px}
.item .time i{width:8px;height:8px;border-radius:50%}
.item .body{min-width:0}
.item .body p{font-size:12.5px;color:var(--muted);margin-top:2px}
.item.done h3{color:var(--muted);text-decoration:line-through}
.item.done .body p{display:none}
.item .opts{margin-top:8px}
.item .opt{padding:5px 11px;font-size:13px;min-height:32px}
.chk{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:transparent;font-size:18px;font-weight:700;padding:0}
.chk.on{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.chk.ans{border-style:dashed}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}


/* workout */
.wtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.wtabs button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-weight:700;font-size:13px;cursor:pointer;line-height:1.2}
.wtabs button small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.wtabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.wtabs button.on small{color:var(--bg)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.ex.complete{border-color:var(--green)}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex-head h3{font-size:16px}
.ex-head .num{font-family:var(--display);font-weight:600;color:var(--muted);font-size:15px;white-space:nowrap}
.themebtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;padding:0;color:var(--fg);display:grid;place-items:center;flex:0 0 auto;transition:background .15s}
.themebtn:active{transform:scale(.94)}
.themebtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.themebtn svg .fillc{fill:currentColor;stroke:none}
/* header workout stopwatch: idle shows 00:00, tap to start / finish */
.sess{background:none;border:0;padding:0;color:inherit;cursor:pointer;display:block}
.sess-t{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.sess-ic{width:0;height:0;border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent var(--muted);flex:0 0 auto}
.sess.on .sess-t{color:var(--red)}
.sess.on .sess-ic{width:9px;height:9px;border:0;border-radius:50%;background:var(--red);animation:sesspulse 1.4s ease-in-out infinite}
@keyframes sesspulse{50%{opacity:.25}}
.sheetbg{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--fg);border-radius:20px;width:100%;max-width:420px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet h3{font-size:20px}
.sheet .big{font-family:var(--display);font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;margin:8px 0 2px}
.sheet .row{margin-top:16px;flex-wrap:nowrap}
.sheet .row .btn{flex:1}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-weight:700;font-size:13px;cursor:pointer}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0;padding-top:0}
.wrow .btn{flex:0 0 auto;font-size:13px;padding:8px 10px;min-height:36px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.cmp figure{margin:0;background:var(--surface-2);border-radius:12px;overflow:hidden}
.cmp img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;max-width:100%}
.cmp figcaption{font-size:12px;font-weight:700;padding:6px 8px;color:var(--muted)}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.th{position:relative;flex:0 0 56px}
.th img{width:56px;height:74px;object-fit:cover;border-radius:8px;display:block}
.th span{display:block;font-size:11px;color:var(--muted);text-align:center}
.thx{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-weight:700;font-size:14px;line-height:22px;padding:0;cursor:pointer}
.target.calib{background:var(--yellow-soft)} .target.calib .big{color:var(--fg)}
.target.goaled{background:var(--green-soft)} .target.goaled .big{color:var(--green)}
.goalbar{margin-top:10px;font-size:12px;font-weight:700;color:var(--muted)}
.goalbar .bar{background:var(--surface)}
.rir{margin:2px 0 6px 50px;padding:8px 10px;background:var(--yellow-soft);border-radius:10px}
.rir p{font-size:12.5px;font-weight:700;margin-bottom:6px}
.rir .opt{padding:5px 12px;min-height:32px;font-size:13px}
.rir .rir-res{margin:6px 0 0;font-weight:500;color:var(--muted)}
@media (max-width:380px){.rir{margin-left:0}}
.journey{margin-top:12px}
.jrow{display:flex;gap:14px;align-items:center}
.jfig{flex:0 0 auto;width:78px;height:130px}
.b-mark{stroke:var(--muted);stroke-width:1.2}
.b-axis{stroke:var(--line);stroke-width:1}
.b-tick{fill:var(--muted);font:700 8px var(--body)}
.b-line{fill:none;stroke:var(--fg);stroke-opacity:.22;stroke-width:.8}
.b-detail{fill:none;stroke:var(--fg);stroke-opacity:.14;stroke-width:.9;stroke-linecap:round}
.b-level{fill:#fff;opacity:.55}
.bg-a{stop-color:var(--green)} .bg-b{stop-color:#3ccf9a}
.milestones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.milestones div{background:var(--surface-2);border-radius:10px;padding:8px;font-size:12px;line-height:1.3}
.milestones div.got{background:var(--green-soft);color:var(--green)}
.milestones b{display:block;font-family:var(--display);font-size:18px}
.b-base{fill:var(--surface-2)} .b-today{fill:var(--green);opacity:.3} .b-fill{fill:var(--green)}
.jtext{min-width:0}
.jbig{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.jbig small{font-size:16px;font-weight:600;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .ch{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.cal .cd{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface-2);color:var(--muted)}
.cal .cd.full{background:var(--green);color:var(--on-accent)}
.cal .cd.partial{background:var(--yellow-soft);color:var(--yellow)}
.cal .cd.missed{background:var(--red-soft);color:var(--red)}
.cal .cd.today{background:var(--surface);color:var(--fg)}
.cal .cd.future,.cal .cd.none{background:transparent;color:var(--muted);opacity:.6}
.cal .cd.is-today{outline:2px solid var(--fg);outline-offset:-2px}
@media (max-width:340px){.jfig{width:66px;height:110px}.jbig{font-size:32px}}
.phase .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:10px}
.phase .steps span{font-size:11px;font-weight:700;text-align:center;padding:6px 2px;border-radius:8px;background:var(--surface-2);color:var(--muted);line-height:1.25}
.phase .steps span.cur{background:var(--fg);color:var(--bg)}
.phase .steps span.done{background:var(--green-soft);color:var(--green)}
.figbox{margin-top:10px;background:var(--surface-2);border-radius:12px;position:relative;padding:6px 0 2px}
.fig{display:block;width:100%;height:96px}
.fig polyline{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:6}
.fig .bd{stroke:var(--fg)} .fig .far{stroke:var(--muted);opacity:.55}
.fig .head{fill:var(--fg)}
.fig .floor{stroke:var(--line);stroke-width:2}
.fig .eq{fill:var(--line)} .fig .eqline{stroke:var(--line);stroke-linecap:round}
.fig .cable{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 3}
.fig .plate{fill:var(--red)} .fig .hub{fill:var(--surface)}
.fig .db{fill:var(--blue)} .fig .bar{stroke:var(--fg);stroke-width:4;stroke-linecap:round}
.fig .padc{fill:var(--yellow)}
.figcap{display:block;text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:4px}
.target{margin-top:10px;background:var(--blue-soft);border-radius:12px;padding:10px 12px}
.target .big{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;color:var(--blue);font-variant-numeric:tabular-nums}
.target p{font-size:13px;margin-top:3px}
.warm{margin-top:8px;font-size:13px;color:var(--muted)}
.warm b{color:var(--fg)}
details.how{margin-top:8px}
details.how summary{cursor:pointer;color:var(--blue);font-weight:700;font-size:13px;list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how p{font-size:13px;margin-top:6px}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.set{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) 42px;gap:8px;align-items:center}
.set .n{font-size:12px;font-weight:700;color:var(--muted)}
.set input{width:100%;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.set.ok input{background:var(--green-soft);border-color:transparent}
.unit{font-size:11px;color:var(--muted);text-align:center}
.guide ol{margin:8px 0 0;padding-left:20px}
.guide li{margin:6px 0;font-size:14px}
.guide summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
.guide summary::-webkit-details-marker{display:none}

/* lists */
ul.clean,ol.clean{margin:0;padding-left:20px} ul.clean li,ol.clean li{margin:5px 0;font-size:14px}
.meal{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.meal .t{font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.meal p{font-size:13px;color:var(--muted);margin-top:2px}
.supp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.supp:first-child{border-top:0}
.supp p{grid-column:1/-1;font-size:13px;color:var(--muted)}
.shop label{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.shop label:first-child{border-top:0}
.shop input{width:20px;height:20px;accent-color:var(--green);flex:0 0 auto}
.shop label.got span{text-decoration:line-through;color:var(--muted)}
.warnbox{background:var(--yellow-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.chart{width:100%;height:auto;display:block}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv b{font-variant-numeric:tabular-nums}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.bub{max-width:88%;padding:10px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--fg);color:var(--bg);border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;margin-top:12px}
.composer textarea{flex:1;resize:none;height:46px}
.composer input{flex:1;min-width:0}
a.btn,a.chip{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;text-align:center}

<script>
/* =========================================================
   DATA
   ========================================================= */
const PROFILE = {boy:168, kilo:69, bel:87.5, hedefBel:77, protein:140, su:3000};
const PROTEIN_OK = PROFILE.protein - 10;
const DAYNAMES = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

/* bar: barbell lift (warm-up ramps); dumb: weight per hand; side: per leg; rest in seconds */
const EX = {
  bench:{n:'Bench press',sets:4,lo:5,hi:8,inc:2.5,start:20,type:'kg',bar:true,rest:150,cue:'Sehpaya uzan, gözlerin barın altında olsun. Kürek kemiklerini geriye sıkıştır, ayaklarını yere bas. Barı göğsünün ortasına kontrollü indir, göğse değince yukarı it.'},
  row:{n:'Barbell row',sets:4,lo:6,hi:8,inc:2.5,start:20,type:'kg',bar:true,rest:120,cue:'Dizlerini hafif bük, kalçadan öne eğil (gövde yere neredeyse paralel). Sırtın düz kalsın. Barı göbeğine doğru çek, dirseklerin geriye gitsin, sonra kontrollü indir.'},
  ohp:{n:'Ayakta omuz press',sets:3,lo:6,hi:10,inc:2.5,start:20,type:'kg',bar:true,rest:120,cue:'Bar köprücük kemiğinin üstünde. Karnını ve kalçanı sık. Barı başının üstüne düz it, kafanı hafif geri çekip yol aç. Belini geriye bükme.'},
  pullup:{n:'Barfiks',sets:3,lo:1,hi:12,inc:1,start:3,type:'reps',rest:120,cue:'Barı omuz genişliğinden biraz geniş tut. Göğsünü bara doğru çek, aşağıda kollarını tam aç. Tek tekrar bile yapamıyorsan salondaki destekli barfiks makinesini kullan ve tekrar sayını yaz.'},
  latraise:{n:'Lateral raise',sets:3,lo:12,hi:15,inc:1,start:4,type:'kg',dumb:true,rest:60,cue:'Ayakta, dambıllar yanında. Dirseklerin hafif bükük, kollarını omuz hizasına kadar yana kaldır. Sallanma, 2 saniyede indir.'},
  pushdown:{n:'Triceps pushdown',sets:2,lo:10,hi:12,inc:2.5,start:10,type:'kg',rest:60,cue:'Kablo makinesinde, ip veya düz barla. Dirseklerin gövdene yapışık kalsın, sadece ön kolların aşağı yukarı hareket etsin.'},
  squat:{n:'Squat',sets:4,lo:5,hi:8,inc:5,start:20,type:'kg',bar:true,rest:150,cue:'Bar ense altında, sırtının üst kısmında. Ayaklar omuz genişliğinde, uçlar hafif dışa. Kalçanı geri ve aşağı it, dizlerin ayak ucu yönünde gitsin. Uyluklar yere paralel olana kadar in, topuklarından it.'},
  rdl:{n:'Romanian deadlift',sets:3,lo:8,hi:10,inc:5,start:30,type:'kg',bar:true,rest:120,cue:'Barı ayakta tut. Dizlerin hafif bükük ve sabit. Kalçanı geriye iterek öne eğil, bar bacaklarını sıyırarak dizin altına kadar insin. Arka bacakta gerilme hissedeceksin. Sırtın hep düz.'},
  legpress:{n:'Leg press',sets:3,lo:10,hi:12,inc:10,start:40,type:'kg',rest:90,cue:'Ayaklar platformda omuz genişliğinde. Dizlerini göğsüne doğru indir, belin minderden kalkmasın. İterken dizlerini en üstte kilitleme.'},
  legcurl:{n:'Leg curl',sets:3,lo:10,hi:12,inc:2.5,start:15,type:'kg',rest:60,cue:'Makinede, rulo topuklarının hemen üstünde. Bacaklarını kontrollü bük, yavaş bırak. Kalçanı minderden kaldırma.'},
  calf:{n:'Baldır kaldırma',sets:3,lo:12,hi:15,inc:5,start:20,type:'kg',rest:60,cue:'Makinede veya basamakta. En altta topuğunu iyice indirip esne, en üstte parmak ucunda 1 saniye sık.'},
  hlr:{n:'Hanging leg raise',sets:3,lo:6,hi:15,inc:1,start:6,type:'reps',rest:60,cue:'Barfiks barından asıl. Dizlerini göğsüne doğru çek, yavaş indir. Sallanma. Zor gelirse dizleri bükük yap.'},
  incdb:{n:'Incline dambıl press',sets:3,lo:8,hi:12,inc:1,start:8,type:'kg',dumb:true,rest:90,cue:'Sehpanın sırtını 30–45 derece kaldır. Dambılları göğsünün üst kısmına indir, dirseklerin gövdeyle 45 derece açı yapsın. Yukarı it.'},
  pulldown:{n:'Lat pulldown',sets:3,lo:8,hi:12,inc:2.5,start:25,type:'kg',rest:90,cue:'Barı omuzdan geniş tut. Göğsünü yukarı kaldır, barı göğsünün üst kısmına çek. Gövdeni geriye sallama.'},
  sdbpress:{n:'Oturarak dambıl omuz press',sets:3,lo:8,hi:12,inc:1,start:6,type:'kg',dumb:true,rest:90,cue:'Sehpa dik, sırtın dayalı. Dambıllar kulak hizasında. Yukarı it, kulak hizasına kadar indir.'},
  cablerow:{n:'Cable row',sets:3,lo:10,hi:12,inc:2.5,start:25,type:'kg',rest:90,cue:'Otur, ayaklar platformda, dizler hafif bükük. Göğsün dik. Tutacağı göbeğine çek, kürek kemiklerini birbirine yaklaştır.'},
  facepull:{n:'Face pull',sets:3,lo:12,hi:15,inc:2.5,start:10,type:'kg',rest:60,cue:'Kablo yüz hizasında, ip tutacakla. İpi yüzüne doğru çek, ellerini kulaklarının yanına aç. Omuz sağlığın için önemli.'},
  curl:{n:'Biceps curl',sets:2,lo:10,hi:12,inc:1,start:6,type:'kg',dumb:true,rest:60,cue:'Ayakta, dirseklerin gövdende sabit. Dambılları sallanmadan kaldır, 2 saniyede indir.'},
  deadlift:{n:'Deadlift',sets:3,lo:5,hi:5,inc:5,start:40,type:'kg',bar:true,rest:180,cue:'Bar yerde, ayak ortasının üstünde. Eğil, barı omuz genişliğinde tut. Sırtını düzelt, göğsünü kaldır. Barı bacaklarına yakın tutarak bacaklarınla yerden it, dik dur. Aynı yoldan indir. Sırtın yuvarlanıyorsa ağırlığı düşür.'},
  bss:{n:'Bulgarian split squat',sets:3,lo:8,hi:10,inc:2,start:0,type:'kg',dumb:true,side:true,rest:90,cue:'Arka ayağının üstü sehpada. Öndeki bacakla dik bir şekilde aşağı in, arka dizin yere yaklaşsın. Ön topuktan it. İlk haftalar ağırlıksız (0 kg) yap.'},
  hipthrust:{n:'Hip thrust',sets:3,lo:8,hi:12,inc:5,start:30,type:'kg',bar:true,rest:90,cue:'Sırtının üst kısmı sehpaya dayalı, bar kalçanın üstünde (altına havlu koy). Kalçanı yukarı it, en üstte 1 saniye sık.'},
  legext:{n:'Leg extension',sets:3,lo:12,hi:15,inc:2.5,start:15,type:'kg',rest:60,cue:'Makinede, rulo ayak bileğinin önünde. Bacağını tam aç, üstte 1 saniye tut, yavaş indir.'},
  crunch:{n:'Cable crunch',sets:3,lo:12,hi:15,inc:2.5,start:15,type:'kg',rest:60,cue:'Kablonun önünde diz çök, ipi başının iki yanında tut. Kalçanı sabit tut, karnından bükülerek dirseklerini dizlerine yaklaştır.'},
  plank:{n:'Plank',sets:3,lo:30,hi:60,inc:5,start:30,type:'sec',rest:60,cue:'Dirsekler omuzlarının altında, vücudun baştan topuğa düz bir çizgi. Karnını sık, kalçan düşmesin.'}
};
const WORKOUTS = {
  UA:{name:'Üst A',day:'Salı',focus:'Güç',ex:['bench','row','ohp',['pullup',4],['latraise',4],'pushdown']},
  LA:{name:'Alt A',day:'Çarşamba',focus:'Güç',ex:['squat','rdl','legpress','legcurl','calf','hlr']},
  UB:{name:'Üst B',day:'Cuma',focus:'Hacim',ex:['incdb','pulldown','sdbpress','cablerow',['latraise',4],'facepull','curl']},
  LB:{name:'Alt B',day:'Cumartesi',focus:'Hacim',ex:['deadlift','bss','hipthrust','legext','calf','crunch','plank']}
};
const SCHEDULE = {2:'UA',3:'LA',5:'UB',6:'LB'};
const CAT = {train:'var(--blue)',meal:'var(--yellow)',supp:'var(--green)',sleep:'var(--muted)',track:'var(--red)'};
const SLEEP_H = [5,6,7,8];



/* =========================================================
   HELPERS
   ========================================================= */
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const daysBetween = (a,b) => Math.round((parseKey(b)-parseKey(a))/86400000);
const addDays = (k,n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const fmt = n => (Math.round(n*100)/100).toString().replace('.',',');
const num = v => { const x = parseFloat(String(v == null ? '' : v).replace(',','.')); return isFinite(x) ? x : NaN; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayKey = () => keyOf(new Date());
const nowHM = () => { const d = new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
function addMin(hm, m){ let [h,mi] = hm.split(':').map(Number); let t = (h*60+mi+m+1440)%1440; return pad(Math.floor(t/60))+':'+pad(t%60); }
function untilText(hm){
  const d = new Date(), [h,m] = hm.split(':').map(Number);
  const s = Math.max(0, Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m, 0) - d)/1000));
  if (s >= 3600) return Math.floor(s/3600)+' sa '+Math.floor((s%3600)/60)+' dk';
  return Math.floor(s/60)+':'+pad(s%60);
}
const roundTo = (x, inc) => Math.max(0, Math.round(x/inc)*inc);

/* =========================================================
   STATE + STORAGE (viewer's private db doc, localStorage fallback)
   ========================================================= */
function defaultState(){
  const t = todayKey();
  return {v:3, start:t, startHM:nowHM(), settings:{wake:'07:00', breakfast:'07:30', workout:'19:00', walk:'18:30', sleep:'23:00'},
    kcal:1850, lastAdjust:null, notes:[], measurements:[{d:t, kg:PROFILE.kilo, bel:PROFILE.bel}],
    logs:{}, shop:{}, setup:{}, chat:[], mem:[]};
}
function merge(data){
  data = data ? JSON.parse(JSON.stringify(data)) : {};

  items.sort((a,b) => a.t.localeCompare(b.t));

function dayTotals(k){
  const plan = dayPlan(k), l = peekLog(k);
  let done = 0; plan.forEach(it => { if (isDone(k, it)) done++; });
  let kcal = 0; if (l && l.c) plan.forEach(it => { if (it.kcal && l.c[it.id]) kcal += it.kcal; });
  if (l && l.c && l.c.protein === 'whey') kcal += 120;
  return {p:proteinSoFar(k), kcal, done, total:plan.length, water:(l && l.water) || 0};
}

/* progression */
/* goal level per exercise for a lean, athletic ~65 kg body (kg, or reps / seconds for bodyweight moves).
   Reaching it switches the exercise to maintenance: no more increases, keep it clean. */
const GOAL = {bench:65, row:55, ohp:40, pullup:10, latraise:10, pushdown:25, squat:85, rdl:80, legpress:140, legcurl:40, calf:60, hlr:15,
  incdb:22, pulldown:60, sdbpress:18, cablerow:60, facepull:25, curl:14, deadlift:100, bss:14, hipthrust:90, legext:50, crunch:40, plank:60};
function lastSession(key, beforeK){
  const ds = Object.keys(state.logs).filter(d => d < beforeK).sort().reverse();
  for (const d of ds){
    const w = state.logs[d].w, sets = w && w.ex && w.ex[key];
    if (sets){ const ok = sets.filter(s => s && s.ok); if (ok.length) return {d, sets:ok, rpe:w.rpe, w}; }
  }
  return null;
}
/* calibration: the first time a weighted exercise is done (in practice week 1, each workout once).
   After every set the user says how many more reps were left; the next set's weight adjusts.
   The weight found is remembered and from then on the app leads. */
function calibrating(key, k){ return EX[key].type === 'kg' && !lastSession(key, k); }
/* best logged value for an exercise (kg, or reps / seconds) up to and including day k */
function bestValue(key, k){
  let b = 0;
  Object.keys(state.logs).filter(d => d <= k).forEach(d => {
    const s = state.logs[d].w && state.logs[d].w.ex && state.logs[d].w.ex[key];
    if (s) s.forEach(x => { if (x && x.ok) b = Math.max(b, EX[key].type === 'kg' ? (+x.kg || 0) : (+x.r || 0)); });
  });
  return b;
}
function goalBarHTML(key, k){
  const g = GOAL[key]; if (!g) return '';
  const e = EX[key], unit = e.type === 'kg' ? ' kg' : e.type === 'sec' ? ' sn' : ' tekrar';
  const cur = bestValue(key, k), pct = Math.min(100, Math.round(cur / g * 100));
  return `<div class="goalbar"><div class="row" style="justify-content:space-between"><span>Hedef ${fmt(g)}${unit}${e.dumb ? ' (tek el)' : ''}</span><span>${cur ? 'en iyi ' + fmt(cur) + unit : 'henüz yok'} · %${pct}</span></div><div class="bar"><i style="width:${pct}%;background:var(--green)"></i></div></div>`;
}
const RIR_STEP = [-1, 0, 1, 2];
function adjustAfterSet(key, kg, rir, k){
  const e = EX[key], l = peekLog(k), sore = l && l.q && l.q.sore === 2;
  let steps = RIR_STEP[rir]; if (sore) steps = Math.min(steps, 0);
  let delta = steps * e.inc;
  if (e.bar) delta = Math.max(-5, Math.min(5, delta));
  let next = roundTo(kg + delta, e.inc);
  if (GOAL[key]) next = Math.min(next, Math.max(GOAL[key], kg));
  return next;
}
function recommend(key, nSets, k){
  const e = EX[key], last = lastSession(key, k), wk = weekOf(k);
  const l = peekLog(k), sore = l && l.q && l.q.sore === 2;
  let r;
  if (last && e.type === 'kg' && last.w.cal && last.w.cal[key] !== undefined && !isDeload(k) && last.w.cal[key] !== Math.max(...last.sets.map(s => +s.kg || 0))){
    r = {kg:last.w.cal[key], reps:Math.round((e.lo + e.hi) / 2), why:'Ayar setlerine göre senin ağırlığın '+fmt(last.w.cal[key])+' kg çıktı. Bugün her sette '+Math.round((e.lo + e.hi) / 2)+' tekrar yap.'};
  } else if (!last){
    if (e.type === 'kg') r = {kg:e.start, reps:e.hi, why:'İlk kez yapıyorsun. Bu ağırlık bilerek hafif: önce hareketi öğren. Tüm setleri '+e.hi+' tekrar yapabilirsen bir dahaki sefere uygulama ağırlığı artıracak.'};
    else r = {kg:null, reps:e.start, why: e.type === 'sec' ? 'İlk kez. Formu bozmadan tutabildiğin kadar tut, süreyi yaz.' : 'İlk kez. Yapabildiğin kadar tekrar yap, sayıyı yaz.'};
  } else if (e.type === 'kg'){
    const top = Math.max(...last.sets.map(s => +s.kg || 0));
    const atTop = last.sets.filter(s => (+s.kg || 0) === top);
    const hit = atTop.length >= nSets && atTop.every(s => (+s.r || 0) >= e.hi);
    if (isDeload(k)) r = {kg:roundTo(top*0.6, e.inc), reps:e.lo, why:'Hafif hafta: son ağırlığının %60’ı. Vücudun toparlanacak, sonraki hafta daha güçlü döneceksin.'};
    else if (hit){
      const jump = (wk <= 8 && last.rpe === 0) ? e.inc*2 : e.inc; /* fast scenario: double jumps allowed for 8 weeks */
      r = {kg:top + jump, reps:e.lo, why:'Geçen sefer tüm setlerde '+e.hi+' tekrar yaptın. Ağırlığı +'+fmt(jump)+' kg artırdım. Bugün '+e.lo+' tekrar yeterli, sonraki seferlerde tekrar sayısını '+e.hi+'’e çıkaracaksın.'};
    } else {
      const minR = Math.min(...atTop.map(s => +s.r || 0));
      const target = Math.min(e.hi, Math.max(e.lo, minR + 1));
      r = {kg:top, reps:target, why:'Aynı ağırlık. Geçen sefer en zayıf setin '+minR+' tekrardı, bugün her sette '+target+' tekrar yap. Tüm setlerde '+e.hi+' tekrar olunca ağırlık artacak.'};
    }
  } else {
    const best = Math.max(...last.sets.map(s => +s.r || 0)), step = e.type === 'sec' ? 5 : 1;
    if (isDeload(k)) r = {kg:null, reps:Math.max(1, Math.round(best*0.6)), why:'Hafif hafta, rahat yap.'};
    else r = {kg:null, reps:best + step, why:'Geçen sefer en iyi setin '+best+(e.type==='sec'?' sn':' tekrar')+'. Bugün '+(best+step)+' hedefle.'};
  }
  const g = GOAL[key];
  if (g && !isDeload(k)){
    if (e.type === 'kg' && r.kg > g){
      const top = last ? Math.max(...last.sets.map(s => +s.kg || 0)) : 0;
      r.kg = Math.max(g, top); r.reps = e.hi; r.goal = true;
      r.why = 'Hedef ağırlığa ulaştın ('+fmt(g)+' kg). Artık artırma yok: bu ağırlıkla temiz ve kontrollü '+e.hi+' tekrar yap, kazandığını koru.';
    } else if (e.type !== 'kg' && r.reps > g){
      r.reps = g; r.goal = true;
      r.why = 'Hedefe ulaştın ('+g+(e.type === 'sec' ? ' sn' : ' tekrar')+'). Her sette bunu koru, formu mükemmel yap.';
    }
  }
  if (calibrating(key, k) && r.kg !== null){ r.cal = true; r.reps = Math.round((e.lo + e.hi) / 2); r.why = 'Ayar seti: bu hafif ağırlıkla başla, her sette '+r.reps+' tekrar yap. Setten sonra kaç tekrar daha yapabileceğini seç; uygulama sonraki setin kilosunu ayarlar. Bulunan ağırlık kaydedilir, sonraki antrenmanlarda uygulama seni yönlendirir.'; }
  if (sore && r.kg){ r.kg = roundTo(r.kg*0.85, e.inc); r.why = 'Kaslarında çok ağrı olduğunu söyledin, bugün ağırlığı %15 azalttım. ' + r.why; }
  return r;
}
function warmupText(key, kg){
  const e = EX[key];
  if (!e.bar || !kg) return '';
  if (kg <= 30) return 'Isınma: boş barla (20 kg) 1 set × 10, yavaş ve düzgün.';
  const h = roundTo(kg*0.5, 2.5), t = roundTo(kg*0.75, 2.5);
  return 'Isınma: boş bar × 10 → '+fmt(h)+' kg × 5 → '+fmt(t)+' kg × 3. Sonra çalışma setlerine geç.';

  s += `<circle class="head" cx="${j.hd[0].toFixed(1)}" cy="${j.hd[1].toFixed(1)}" r="8"/>`;

  open(){ return this.db ? Promise.resolve(this.db) : new Promise((res, rej) => { const r = indexedDB.open('cepkocum-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos', {keyPath:'id'}); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  tx(mode, fn){ return this.open().then(db => new Promise((res, rej) => { const t = db.transaction('photos', mode), q = fn(t.objectStore('photos')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); })); },
  all(){ return this.tx('readonly', s => s.getAll()).then(r => r || []); },
  put(p){ return this.tx('readwrite', s => s.put(p)); },
  del(id){ return this.tx('readwrite', s => s.delete(id)); }
};
let photoPose = 'on', photoDel = null, photoUrls = [];
function compressImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 900, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('sıkıştırılamadı')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bu dosya açılamadı. JPG veya PNG fotoğraf seç.')); };
    img.src = url;
  });
}

async function addPhoto(file){
  try {
    const blob = await compressImage(file);
    await PDB.put({id: Date.now() + '-' + Math.random().toString(36).slice(2,7), d: todayKey(), pose: photoPose, blob});
    const l = dayLog(todayKey()); l.c.foto = true; save();
    toast(POSES[photoPose] + ' fotoğrafı eklendi');
  } catch(e){ toast(e && e.message ? e.message : 'Fotoğraf eklenemedi'); }
  renderPhotos();
}

function coachNotes(k){

  else if (wk <= 2) out.push(['blue', 'Hafta '+wk+': hareketleri öğrenme dönemi. Ağırlıklar hafif, tekniğe odaklan.']);
  if (k === state.start && dayPlan(k).length < 6) out.push(['green', 'Hoş geldin. Bugün sadece kalan görevleri yap. Programın yarın sabah '+state.settings.wake+'’de tam olarak başlıyor.']);
  if (w && !dayPlan(k).some(it => it.id === 'antrenman')){ /* workout time passed before first open */ }
  else if (w){
    const done = l && l.w && l.w.done;
    if (done) out.push(['green', WORKOUTS[w].name+' bitti. Şimdi akşam yemeğini ye ve erken yat.']);
    else if (nowHM() > addMin(state.settings.workout, 120)){
      let rd = 1; while (SCHEDULE[(dow + rd) % 7] && rd < 7) rd++;
      out.push(['red', 'Bugünkü '+WORKOUTS[w].name+' antrenmanı yapılmadı. '+(rd === 1 ? 'Yarın dinlenme günün: antrenmanı yarın yap.' : 'İlk dinlenme günün '+DAYNAMES[(dow + rd) % 7]+': o gün yap.')+' Antrenman sekmesinden '+WORKOUTS[w].name+'’yı seç.']);
    }
    else out.push(['blue', 'Bugün '+WORKOUTS[w].name+', saat '+state.settings.workout+'. Ne kaldıracağın Antrenman sekmesinde hazır.']);
  } else out.push(['blue', 'Bugün ağırlık yok. 40–50 dakika eğimli yürüyüş yap, 10.000 adımı tamamla. Yağ yakımını en çok bu hızlandırır.']);
  if (l && l.q && l.q.sore === 2) out.push(['red', 'Kas ağrın çok. Bugünkü ağırlıklar %15 azaltıldı. Isınmayı uzun tut.']);
  const yk = addDays(k,-1);
  if (daysBetween(state.start, yk) >= 0){
    const yl = peekLog(yk);
    if (yl && dayPlan(yk).some(it => it.id === 'kahvalti')){
      const yp = proteinSoFar(yk);
      if (yp < 110) out.push(['yellow', 'Dün protein ~'+yp+' g’da kaldı. Bugün 21:00’de whey içmeyi unutma.']);
      if (yl.q && yl.q.offplan === 2) out.push(['yellow', 'Dün plan dışı çok yedin. Telafi için aç kalma, bugün plana birebir uy.']);
    }
    const yw = SCHEDULE[parseKey(yk).getDay()];
    if (yw && !w && !(yl && yl.w && yl.w.done) && dayPlan(yk).some(it => it.id === 'antrenman')) out.push(['red', 'Dünkü '+WORKOUTS[yw].name+' antrenmanı yapılmadı. Bugün yap: Antrenman sekmesi → '+WORKOUTS[yw].name+'.']);
  }
  const last7 = []; for (let i=1;i<=7;i++){ const d = addDays(k,-i); const x = peekLog(d); if (x && x.q) last7.push(x.q); }
  const sl = last7.filter(q => q.sleep !== undefined).map(q => SLEEP_H[q.sleep]);
  if (sl.length >= 3){ const avg = sl.reduce((a,b)=>a+b,0)/sl.length; if (avg < 7) out.push(['yellow', 'Son günlerde ortalama ~'+fmt(Math.round(avg*10)/10)+' saat uyuyorsun. Bu gece '+state.settings.sleep+'’te yatakta ol.']); }
  const tired = last7.filter(q => q.energy === 0).length;
  if (tired >= 4) out.push(['red', 'Son 7 günün '+tired+'’ünde yorgun uyandın. Bu hafta kan tahlili yaptır: ferritin, B12, D vitamini, TSH.']);
  if (dow === 1 && !(l && l.c && l.c.olcum)) out.push(['red', 'Bugün ölçüm günü. Kilo ve belini İlerleme sekmesine yaz.']);
  return out.slice(0,4);
}

/* goal journey: only completed days count. A day is complete with ≥90% of its tasks done and the key ones

/* full look takes ~10 months of completed days; the stages are milestones on the way */
const GOAL_DAYS = 300;
const MILESTONES = [{d:56, name:'Belirgin fark', what:'Aşama 1 biter: aynada ve belde net fark.'}, {d:112, name:'Kuru görünüm', what:'Karın çizgileri, bel ~78 cm.'}, {d:300, name:'Tom Holland görünümü', what:'Dolgun omuz ve kollar, atletik V yapı.'}];
const KEY_TASKS = ['kahvalti', 'magnezyum', 'antrenman', 'yuruyus'];
function dayStatus(k){
  if (k < state.start || k > todayKey()) return 'future';
  const plan = dayPlan(k); if (!plan.length) return 'none';
  const done = plan.filter(it => isDone(k, it)).length, ratio = done / plan.length;
  const keys = plan.filter(it => KEY_TASKS.includes(it.id)).every(it => isDone(k, it));
  if (ratio >= 0.9 && keys) return 'full';
  if (k === todayKey()) return 'today';
  if (k === state.start) return 'none'; /* the day the app was first opened is never marked as missed */
  if (done === 0) return 'missed';
  return k === todayKey() ? 'today' : 'partial';
}
function completedDays(){
  let n = 0;
  for (let d = state.start; d <= todayKey(); d = addDays(d, 1)) if (dayStatus(d) === 'full') n++;
  return n;
}
function todayRatio(){ const k = todayKey(), p = dayPlan(k); return p.length ? p.filter(it => isDone(k, it)).length / p.length : 0; }

function phaseCardHTML(){

function autoAdjust(){
  const m = state.measurements.slice().sort((a,b) => a.d.localeCompare(b.d)), last = m[m.length-1];
  /* entering stage 3: move to maintenance calories once */
  if (last.bel <= 78 && !state.phase3){
    state.phase3 = last.d; state.kcal = Math.max(state.kcal, 2200); state.lastAdjust = last.d;
    state.notes.push({d:last.d, t:'Belin 78 cm’ye indi: aşama 3’e geçtin. Kaloriyi '+state.kcal+' kcal’a çıkardım. Artık amaç kas eklemek ve ağırlık hedeflerine ulaşmak. Akşam pilavını tam porsiyon ye.'});
    return;
  }
  const prev = m.filter(x => daysBetween(x.d, last.d) >= 14).pop();
  if (!prev || (state.lastAdjust && daysBetween(state.lastAdjust, last.d) < 14)) return;
  const weeks = daysBetween(prev.d, last.d)/7, belDrop = prev.bel - last.bel, kgRate = (prev.kg - last.kg)/weeks;
  if (state.phase3){
    if (belDrop < -1){ state.kcal = Math.max(1900, state.kcal - 100); state.lastAdjust = last.d; state.notes.push({d:last.d, t:'2 haftada bel '+fmt(-belDrop)+' cm arttı. Kaloriyi '+state.kcal+' kcal’a indirdim.'}); }
    return;
  }
  if (belDrop < 0.5 && kgRate < 0.2){
    state.kcal = Math.max(1650, state.kcal - 150); state.lastAdjust = last.d;
    state.notes.push({d:last.d, t:'2 haftada bel '+fmt(belDrop)+' cm değişti, hızlı senaryo için yavaş. Günlük kaloriyi '+state.kcal+' kcal’a düşürdüm. Akşam pilav veya ekmeği yarıya indir, adımları 10.000’e tamamla.'});
  } else if (kgRate > 1){
    state.kcal = Math.min(2300, state.kcal + 150); state.lastAdjust = last.d;
    state.notes.push({d:last.d, t:'Haftada '+fmt(Math.round(kgRate*10)/10)+' kg veriyorsun, kas kaybı riski var. Kaloriyi '+state.kcal+' kcal’a çıkardım. Ara öğüne 1 muz ekle.'});
  } else if (belDrop >= 0.5){
    state.lastAdjust = last.d;
    state.notes.push({d:last.d, t:'2 haftada bel '+fmt(belDrop)+' cm azaldı. Hızlı senaryo yolunda, hiçbir şeyi değiştirme.'});
  }
}

          + `</div>`;

  html += `</div>`;
  const done = wl && wl.done;
  if (done){
    html += `<div class="card" style="margin-top:14px"><h3>Antrenman tamamlandı ✓</h3><p class="muted small" style="margin-top:4px">Nasıl geçti?</p><div class="opts" style="margin-top:8px">${['Kolaydı','İyiydi','Çok zordu'].map((o,i) => `<button type="button" class="opt${wl.rpe===i?' on':''}" data-rpe="${i}">${o}</button>`).join('')}</div>
      <p class="muted small" style="margin-top:10px">Şimdi 1 saat içinde akşam yemeğini ye. Proteini atlama.</p><button type="button" class="link" data-act="unfinish" style="margin-top:8px">Bitirmeyi geri al</button></div>`;
  } else html += `<button type="button" class="btn primary full" data-act="finish" style="margin-top:14px;min-height:50px">Antrenmanı bitir</button>`;
  view.innerHTML = html;
  animateFigs();
}

function lineChart(points, field, goal, unit, color){
  const W = 560, H = 190, L = 40, R = 14, T = 16, B = 26;
  const vals = points.map(p => p[field]).concat(goal !== null ? [goal] : []);
  const min = Math.floor(Math.min(...vals) - 1), max = Math.ceil(Math.max(...vals) + 1);
  const t0 = parseKey(points[0].d).getTime(), t1 = Math.max(t0 + 7*86400000, parseKey(points[points.length-1].d).getTime());
  const x = d => L + (parseKey(d).getTime()-t0)/(t1-t0)*(W-L-R), y = v => T + (max-v)/(max-min)*(H-T-B);
  let g = '';
  const step = Math.max(1, Math.round((max-min)/4));
  for (let v = min; v <= max; v += step) g += `<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  if (goal !== null) g += `<line x1="${L}" x2="${W-R}" y1="${y(goal).toFixed(1)}" y2="${y(goal).toFixed(1)}" stroke="var(--green)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${(y(goal)-5).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--green)">hedef ${fmt(goal)} ${unit}</text>`;
  const pts = points.map(p => [x(p.d), y(p[field])]);
  if (pts.length > 1) g += `<polygon points="${pts[0][0].toFixed(1)},${H-B} ${pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')} ${pts[pts.length-1][0].toFixed(1)},${H-B}" fill="${color}" opacity="0.12"/><polyline points="${pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p,i) => { const last = i === pts.length-1; g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last?5:3}" fill="${last?color:'var(--surface)'}" stroke="${color}" stroke-width="2"/>`; });
  const lp = points[points.length-1], dd = d => d.slice(8)+'.'+d.slice(5,7);
  g += `<text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">${dd(points[0].d)}</text>`;
  if (points.length > 1) g += `<text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${dd(lp.d)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${field} grafiği">${g}</svg>`;
}

const QN = {sleep:SLEEP_H.map(h => h+' sa'), energy:['yorgun','normal','dinç'], sore:['yok','hafif','çok'], offplan:['hayır','biraz','çok'], steps:['az','orta','çok']};
const MEM_RE = /\[\[HAFIZA:\s*([^\]]+?)\s*\]\]/g;
function addMemory(t, by){
  t = String(t).trim().slice(0, 200);
  if (!t || state.mem.some(m => m.t === t)) return;
  state.mem.push({d:todayKey(), t, by});
  if (state.mem.length > 40) state.mem = state.mem.slice(-40);
}

function fmtAI(t){ return esc(String(t).replace(MEM_RE, '').trim()).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#+\s*/gm,''); }
function dayLine(d){
  const l = peekLog(d), t = dayTotals(d), dow = parseKey(d).getDay();
  let s = d+' '+DAYNAMES[dow]+': protein~'+t.p+'g, su '+fmt(t.water/1000)+'L, görev '+t.done+'/'+t.total;
  if (SCHEDULE[dow]) s += ', planlı '+WORKOUTS[SCHEDULE[dow]].name;
  else s += ', yürüyüş '+(l && l.c && l.c.yuruyus ? 'yapıldı'+(l.walkMin ? ' ('+l.walkMin+' dk)' : '') : 'yok');
  if (l && l.w && l.w.min) s += ', antrenman süresi '+l.w.min+' dk';
  if (l && l.q && Object.keys(l.q).length) s += ', cevaplar: '+Object.keys(l.q).map(q => q+'='+(QN[q] ? QN[q][l.q[q]] : l.q[q])).join(' ');
  if (l && l.w && l.w.key) s += ', yapılan '+WORKOUTS[l.w.key].name+(l.w.done?' (bitti)':' (yarım)')+': '+Object.keys(l.w.ex||{}).map(x => { const ok = l.w.ex[x].filter(z=>z&&z.ok); return ok.length ? EX[x].n+' '+ok.map(z=>(EX[x].type==='kg'?fmt(z.kg)+'kg×':'')+z.r).join('/') : ''; }).filter(Boolean).join('; ');
  return s;
}
/* every exercise ever done: first, last and best, so the coach sees the whole progression */
function exerciseHistory(){
  const ds = Object.keys(state.logs).sort(), out = [];
  Object.keys(EX).forEach(key => {
    const ses = [];
    ds.forEach(d => { const s = state.logs[d].w && state.logs[d].w.ex && state.logs[d].w.ex[key]; if (s){ const ok = s.filter(x => x && x.ok); if (ok.length) ses.push({d, ok}); } });
    if (!ses.length) return;
    const e = EX[key], f = ses[0], z = ses[ses.length-1], v = x => e.type === 'kg' ? fmt(+x.kg || 0)+'kg×'+x.r : x.r + (e.type === 'sec' ? 'sn' : ' tekrar');
    out.push(e.n+': '+ses.length+' seans; ilk '+f.d+' '+v(f.ok[0])+'; son '+z.d+' '+z.ok.map(v).join('/')+'; en iyi '+fmt(bestValue(key, todayKey()))+(e.type === 'kg' ? ' kg' : '')+'; hedef '+GOAL[key]);
  });

async function sendChat(text){
  const err = document.getElementById('chatErr');
  if (!text.trim()){ err.textContent = 'Önce bir mesaj yaz.'; err.hidden = false; return; }
  if (!sample){ err.textContent = 'Koç sohbeti burada çalışmıyor.'; err.hidden = false; return; }
  state.chat.push({role:'user', content:text.trim()});
  if (state.chat.length > 30) state.chat = state.chat.slice(-30);
  chatBusy = true; renderCoach();
  const bub = document.createElement('div'); bub.className = 'bub ai'; bub.textContent = 'Düşünüyor…';
  document.getElementById('chat').appendChild(bub); bub.scrollIntoView({block:'nearest'});
  const turns = [{role:'user', content:coachRules(false)}].concat(state.chat.slice(-12));
  chatCtl = new AbortController();
  const keep = ans => {
    const found = [...String(ans).matchAll(MEM_RE)].map(m => m[1]);
    found.forEach(t => addMemory(t, 'koç'));
    state.chat.push({role:'assistant', content:String(ans).replace(MEM_RE, '').trim()});
    if (found.length) toast('Koçun hafızasına eklendi');
  };
  try {
    const {text:ans} = await sample(turns, {cache:false, signal:chatCtl.signal, onText:({text}) => { bub.innerHTML = fmtAI(text); }});
    keep(ans);
  } catch(e){
    if (e && e.text) keep(e.text);

    if (code !== 'cancelled'){
      chatBusy = false; save(); renderCoach();
      const er = document.getElementById('chatErr');
      er.textContent = ({not_granted:'Koçun Claude’u kullanmasına izin verilmedi.', rate_limited:'Çok fazla mesaj gönderildi. Biraz bekleyip tekrar dene.', session_expired:'Oturumun kapanmış. Tekrar giriş yap.'})[code] || 'Yanıt alınamadı. Tekrar dene.';
      er.hidden = false; return;
    }
  }
  chatBusy = false; save(); renderCoach();
}

  if (d.water){ const l = dayLog(k); l.water = Math.min(6000, l.water + (+d.water)); if (l.water >= 1000) l.c.su = true; if (l.water >= 2000) l.c.su2 = true; save(); render(); return; }
  if (d.pick){ pickedWorkout = d.pick; render(); return; }
  if (d.set){
    const [wk, key, i, rest] = d.set.split('|'), l = dayLog(k), w = ensureWorkout(l, wk);
    const arr = w.ex[key] = w.ex[key] || [];
    const kgEl = document.getElementById('kg-'+key+'-'+i), rEl = document.getElementById('r-'+key+'-'+i);
    const cur = arr[+i] || {}, ok = !cur.ok;
    const kg = kgEl ? num(kgEl.value) : undefined, r = num(rEl.value);
    if (ok && (!(r >= 0) || (kgEl && !(kg >= 0)))){ toast('Kilo ve tekrar sayısını rakamla yaz'); return; }
    arr[+i] = {kg: kgEl ? kg : undefined, r: isFinite(r) ? Math.round(r) : 0, ok};
    if (ok && EX[key].type === 'kg' && kg > 300){ arr[+i].ok = false; toast('Kilo hatalı görünüyor, kontrol et'); save(); render(); return; }
    save(); render();
    if (ok){ lastRestText = nextSetText(wk, key, +i); startTimer(+rest); restPush(+rest, lastRestText); }
    else restCancel();
    return;
  }
  if (d.themeSet){ setTheme(d.themeSet); return; }
  if (d.alarmSet){ lsSet('cepkocum-alarm', d.alarmSet); render(); if (d.alarmSet === 'on') beep(); toast('Alarm sesi ' + (d.alarmSet === 'on' ? 'açık' : 'kapalı')); return; }
  if (d.pose){ photoPose = d.pose; photoDel = null; renderPhotos(); return; }
  if (d.pdel){ photoDel = d.pdel; renderPhotos(); return; }
  if (d.act === 'pdelNo'){ photoDel = null; renderPhotos(); return; }
  if (d.act === 'pdelYes'){ const id = photoDel; photoDel = null; PDB.del(id).then(renderPhotos).then(() => toast('Fotoğraf silindi')).catch(() => toast('Silinemedi')); return; }
  if (d.act === 'photoAI'){ analyzePhotos(b); return; }
  if (d.act === 'backup'){ exportBackup(); return; }
  if (d.act === 'importYes'){ state = merge(pendingImport); pendingImport = null; save(); render(); toast('Yedek yüklendi'); return; }
  if (d.act === 'importNo'){ pendingImport = null; render(); return; }
  if (d.rir){
    const [wk, key, i, v] = d.rir.split('|'), l = dayLog(k), w = ensureWorkout(l, wk), arr = (w.ex[key] = w.ex[key] || []), s = arr[+i];
    if (!s || !s.ok) return;
    s.rir = +v;
    const next = adjustAfterSet(key, +s.kg || 0, +v, k);
    w.adj = Object.assign({}, w.adj, {[key]: next});
    w.cal = Object.assign({}, w.cal, {[key]: +v === 1 ? (+s.kg || 0) : next});
    save(); render();
    if (!document.getElementById('timer').hidden){ lastRestText = nextSetText(wk, key, +i); restPush(Math.max(10, Math.round((timerEnd - Date.now()) / 1000)), lastRestText); }
    return;
  }
  if (d.copy){
    const u = watchURL(d.copy);
    const done = () => { b.textContent = 'Kopyalandı ✓'; setTimeout(() => { b.textContent = 'Adresi kopyala'; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(done).catch(() => toast(u));
    else toast(u);
    return;
  }
  if (b.id === 'hdrClock') return sessTap();
  if (d.sess) return sessAction(d.sess);
  if (d.act === 'finish'){
    const running = state.sess && state.sess.kind === 'train', min = running ? sessFinish() : 0;
    const l = dayLog(k), w = ensureWorkout(l, currentWorkoutKey()); w.done = true; if (min) w.min = min;
    save(); render(); toast('Antrenman kaydedildi' + (min ? ': ' + min + ' dk' : '')); window.scrollTo(0, document.body.scrollHeight); return;
  }
  if (d.act === 'unfinish'){ const l = dayLog(k); if (l.w) l.w.done = false; save(); render(); return; }
  if (d.rpe !== undefined){ const l = dayLog(k); if (l.w){ l.w.rpe = +d.rpe; save(); render(); toast(+d.rpe === 2 ? 'Not aldım. Ağırlık artışını acele etmeyeceğim.' : 'Not aldım'); } return; }
  if (d.act === 'measure'){
    const kg = num(document.getElementById('mKg').value), bel = num(document.getElementById('mBel').value);
    const dt = document.getElementById('mDate').value || k, er = document.getElementById('mErr');
    if (!(kg > 30 && kg < 200) || !(bel > 50 && bel < 160)){ er.textContent = 'Kiloyu ve beli yaz (örnek: 68,4 ve 86).'; er.hidden = false; return; }
    if (dt > k){ er.textContent = 'İleri bir tarih seçilemez.'; er.hidden = false; return; }
    state.measurements = state.measurements.filter(m => m.d !== dt); state.measurements.push({d:dt, kg, bel});
    dayLog(dt).c.olcum = true; autoAdjust(); save(); render(); toast('Ölçüm kaydedildi'); return;
  }
  if (d.act === 'pushOn'){ b.disabled = true; b.textContent = 'Açılıyor…'; enablePush(); return; }
  if (d.act === 'pushOff'){ disablePush(); return; }
  if (d.act === 'pushTest'){ pushApi('test', {device_id:deviceId()}).then(r => toast(r && r.result === 'ok' ? 'Deneme bildirimi gönderildi' : 'Gönderilemedi, bildirimleri kapatıp yeniden aç')).catch(() => toast('İnternet bağlantını kontrol et')); return; }
  if (d.delmem !== undefined){ state.mem.splice(+d.delmem, 1); save(); render(); return; }
  if (d.act === 'reset'){ confirmReset = true; render(); return; }
  if (d.act === 'resetNo'){ confirmReset = false; render(); return; }
  if (d.act === 'resetYes'){ confirmReset = false; settingsOpen = false; state = defaultState(); pickedWorkout = null; save(); render(); toast('Program bugünden başladı'); return; }
  if (d.act === 'clearChat'){ state.chat = []; save(); render(); return; }
  if (d.ask){ if (!chatBusy) sendChat(d.ask); return; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'photoIn'){ const f = el.files && el.files[0]; if (f) addPhoto(f); el.value = ''; return; }
  if (el.id === 'importIn'){
    const f = el.files && el.files[0]; el.value = '';
    if (!f) return;
    f.text().then(t => { const o = JSON.parse(t); if (!o || typeof o !== 'object' || !o.start || !o.logs) throw new Error(); pendingImport = o; settingsOpen = true; render(); })
      .catch(() => toast('Bu dosya bir Cep Koçum yedeği değil'));
    return;
  }
  if (el.dataset.shop){ const [wk,i] = el.dataset.shop.split('|'); state.shop = {[wk]: Object.assign({}, state.shop[wk] || {}, {[i]: el.checked})}; save(); el.closest('label').classList.toggle('got', el.checked); return; }
  if (el.dataset.ex){
    const l = dayLog(todayKey()), w = ensureWorkout(l, el.dataset.w), arr = w.ex[el.dataset.ex] = w.ex[el.dataset.ex] || [];
    const cur = arr[+el.dataset.i] || {ok:false}, v = num(el.value);
    if (isFinite(v)) { cur[el.dataset.f] = el.dataset.f === 'r' ? Math.round(v) : v; arr[+el.dataset.i] = cur; save(); }
    return;
  }
  const map = {setWake:'wake', setBreakfast:'breakfast', setWorkout:'workout', setWalk:'walk', setSleep:'sleep'};
  if (map[el.id] && el.value){ state.settings[map[el.id]] = el.value; save(); render(); toast('Plan yeni saate göre güncellendi'); }
});
document.addEventListener('toggle', e => {
  if (e.target.id === 'settingsBox') settingsOpen = e.target.open;
  if (e.target.id === 'guideBox') guideOpen = e.target.open;
}, true);
document.addEventListener('submit', e => {
  if (e.target.id === 'memForm'){
    e.preventDefault();
    const v = document.getElementById('memIn').value.trim(); if (!v) return;
    addMemory(v, 'sen'); memDraft = ''; save(); render(); toast('Koçun bunu hatırlayacak'); return;
  }
  if (e.target.id !== 'composer') return;
  e.preventDefault();
  if (chatBusy){ chatCtl && chatCtl.abort(); return; }
  sendChat(document.getElementById('chatIn').value);
});
document.addEventListener('keydown', e => {
  if (e.target.id !== 'chatIn') return;
  const er = document.getElementById('chatErr'); if (er) er.hidden = true;
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); document.getElementById('composer').requestSubmit(); }
});

function render(){
  renderTabs(); renderHeader(); syncWakeLock();
  ({today:renderToday, workout:renderWorkout, food:renderFood, progress:renderProgress, coach:renderCoach}[tab] || renderToday)();
}
render();
connect();
pushSync();
pullRemote();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ render(); pullRemote(); pushSync(); } });

let lastMinute = nowHM(), lastDay = todayKey();
setInterval(() => {
  renderHeader();
  const n = document.getElementById('nextIn'); if (n) n.textContent = untilText(n.dataset.t);
  const hm = nowHM(), dk = todayKey();
  if (hm === lastMinute && dk === lastDay) return;
  lastMinute = hm;
  if (dk !== lastDay){ lastDay = dk; pickedWorkout = null; snoozes = []; alertQueue = []; }
  checkAlerts(hm);
  const busy = document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  if (tab === 'today' && !busy) renderToday();
}, 1000);
</script>
